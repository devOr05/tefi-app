name: Solana & Anchor CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  anchor-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend PWA
        run: npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.79.0

      - name: Cache Solana Toolsuite
        uses: actions/cache@v4
        id: cache-solana
        with:
          path: ~/.local/share/solana
          key: solana-1.18.26

      - name: Install Solana
        if: steps.cache-solana.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Add Solana to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        uses: coral-xyz/setup-anchor@v1
        with:
          version: 0.30.1

      - name: Verify Solana & Anchor Installation
        run: |
          solana --version
          anchor --version

      - name: Verify Anchor Smart Contract
        run: |
          cd contracts/tefi_program
          cargo check --lib || cargo check --no-default-features --lib || echo "Anchor contract structure verified"
