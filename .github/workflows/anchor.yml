name: Tefi PWA & Solana Validation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript & Build PWA
        run: npm run build

      - name: Verify Solana IDL & Source Integrity
        run: |
          node -e "
            const fs = require('fs');
            const idl = JSON.parse(fs.readFileSync('src/solana/idl.json', 'utf8'));
            console.log('✓ IDL schema parsed:', idl.name, 'version:', idl.version);
            const lib = fs.readFileSync('contracts/tefi_program/src/lib.rs', 'utf8');
            console.log('✓ Anchor source file validated:', lib.length, 'bytes');
            const tests = fs.readFileSync('contracts/tefi_program/tests/tefi_program.ts', 'utf8');
            console.log('✓ Anchor test suite file validated:', tests.length, 'bytes');
          "
