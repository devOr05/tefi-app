name: Anchor Contract Compilation & Localnet Tests

on:
  push:
    branches: [ main, 'test/**', 'fix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-contract:
    name: Build & Test Anchor Program
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain v1.75.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75.0
          components: rustfmt, clippy

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Solana CLI v1.18.26 & Generate Wallet
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase --force -s -o ~/.config/solana/id.json
          solana config set --url http://127.0.0.1:8899 -k ~/.config/solana/id.json

      - name: Install Anchor CLI v0.29.0
        run: |
          npm install -g @coral-xyz/anchor-cli@0.29.0

      - name: Install Project & Contract Dependencies
        run: |
          npm ci
          cd contracts/tefi_program && npm install

      - name: Resolve Program ID from Anchor.toml
        run: |
          PROGRAM_ID=$(grep -m1 '^tefi_program = ' contracts/tefi_program/Anchor.toml | cut -d'"' -f2)
          grep -q "declare_id!(\"$PROGRAM_ID\")" contracts/tefi_program/programs/tefi_program/src/lib.rs
          grep -q "\"address\": \"$PROGRAM_ID\"" src/solana/idl.json
          echo "PROGRAM_ID=$PROGRAM_ID" >> $GITHUB_ENV
          echo "Program ID is consistent across Anchor.toml, lib.rs and idl.json: $PROGRAM_ID"

      - name: Build Anchor SBF Program Binary
        run: |
          cd contracts/tefi_program
          cargo build-sbf --manifest-path programs/tefi_program/Cargo.toml || true
          cargo build-sbf --manifest-path programs/tefi_program/Cargo.toml
          mkdir -p target/idl
          # target/deploy/tefi_program.so is the stripped binary cargo build-sbf produces: the one to test and deploy.
          # (target/sbf-solana-solana/release/ holds the unstripped build, which costs more rent on-chain.)
          ls -la target/deploy/ target/sbf-solana-solana/release/tefi_program.so
          cp ../../src/solana/idl.json target/idl/tefi_program.json

      - name: Upload SBF Program Binary
        uses: actions/upload-artifact@v4
        with:
          name: tefi_program-sbf
          path: contracts/tefi_program/target/deploy/tefi_program.so
          if-no-files-found: error

      - name: Run Dynamic Anchor Tests Against Local Validator
        run: |
          cd contracts/tefi_program
          mkdir -p .anchor/test-ledger
          # Launch local validator with canonical Program ID and compiled SBF binary
          solana-test-validator \
            --ledger .anchor/test-ledger \
            --bpf-program $PROGRAM_ID target/deploy/tefi_program.so \
            --reset > .anchor/test-ledger/validator.log 2>&1 &
          VALIDATOR_PID=$!

          # Wait for validator RPC to be responsive
          for i in $(seq 1 30); do
            if solana cluster-version --url http://127.0.0.1:8899 >/dev/null 2>&1; then
              echo "Solana test validator is active and healthy!"
              break
            fi
            echo "Waiting for validator to boot ($i/30)..."
            sleep 1
          done

          # Verify the program is loaded at the canonical address
          solana program dump $PROGRAM_ID /tmp/tefi_verified.so --url http://127.0.0.1:8899
          ls -lh /tmp/tefi_verified.so

          # Export provider variables
          export ANCHOR_PROVIDER_URL="http://127.0.0.1:8899"
          export ANCHOR_WALLET="$HOME/.config/solana/id.json"

          # Run dynamic tests against the active validator
          anchor test --skip-local-validator --skip-build --skip-deploy

      - name: Diagnostic Logs on Failure
        if: failure()
        run: |
          cat contracts/tefi_program/.anchor/test-ledger/test-ledger-log.txt || true
          cat contracts/tefi_program/.anchor/test-ledger/validator.log || true
