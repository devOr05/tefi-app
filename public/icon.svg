<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  
  <defs>
    <!-- Clip limpio al ras del borde horizontal superior de la T (Y = 150) -->
    <clipPath id="clipTopFlushL">
      <rect x="140" y="50" width="130" height="100" />
    </clipPath>
    <clipPath id="clipTopFlushR">
      <rect x="245" y="50" width="130" height="100" />
    </clipPath>

    <linearGradient id="bar4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="50%" stop-color="#14F195"/>
      <stop offset="100%" stop-color="#00D287"/>
    </linearGradient>

    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14F195"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>

    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#14F195" stop-opacity="0.65"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <filter id="coinShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#78350F" flood-opacity="0.28"/>
    </filter>

    <filter id="upperCoinShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#78350F" flood-opacity="0.28"/>
    </filter>

    <filter id="bigCoinShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#78350F" flood-opacity="0.35"/>
    </filter>

    <filter id="glowCyan" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#14F195" flood-opacity="0.40"/>
    </filter>
  </defs>

  
  <rect width="512" height="512" rx="128" fill="#FFFFFF"/>
  <rect width="508" height="508" x="2" y="2" rx="126" stroke="#E2E8F0" stroke-width="2"/>

  <!-- TALLO VERTICAL ASCENDENTE -->
  <g filter="url(#softShadow)">
    <rect x="238" y="215" width="36" height="240" rx="18" fill="url(#stemGrad)"/>
  </g>

  <!-- BARRAS 1, 2, 3 (Idénticas a la Opción 4C) -->
  <g filter="url(#softShadow)">
    <!-- Barra 1 Base (110px) -->
    <path d="M210 455 L292 455 C301 455 307 448 309 440 L314 420 C316 412 310 405 302 405 H220 C211 405 205 412 203 420 L198 440 C196 448 202 455 210 455 Z" fill="url(#bar1Grad)"/>

    <!-- Barra 2 (150px) -->
    <path d="M190 385 L322 385 C331 385 338 378 340 370 L346 350 C348 342 342 335 334 335 H202 C193 335 186 342 184 350 L178 370 C176 378 182 385 190 385 Z" fill="url(#bar2Grad)"/>

    <!-- Barra 3 (205px) -->
    <path d="M162 312 L350 312 C360 312 368 305 370 296 L376 276 C378 267 372 259 363 259 H175 C165 259 157 266 155 275 L149 295 C147 304 153 312 162 312 Z" fill="url(#bar3Grad)"/>
  </g>

  
  <g filter="url(#softShadow)">
    <!-- Barra 4 Superior Grande (350px) -->
    <path d="M100 235 L388 235 C402 235 412 225 416 212 L426 178 C430 164 420 150 405 150 L117 150 C103 150 93 160 89 173 L79 207 C75 221 85 235 100 235 Z" fill="url(#bar4Grad)" filter="url(#glowCyan)"/>
  </g>


  <!-- 2 Monedas chicas con exactamente 3px de desahogo (cx=201, 311, cy=150, r=16) -->
  
  <g filter="url(#coinShadow)" clip-path="url(#clipTopFlushL)">
    <circle cx="201" cy="150" r="16" fill="url(#goldGrad)" stroke="#FEF08A" stroke-width="1.3"/>
    <circle cx="201" cy="150" r="13" fill="none" stroke="#78350F" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.35"/>
    <path d="M194 147 H208 M201 140 V151" stroke="#78350F" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M194 147 H208 M201 140 V151" stroke="#FFFFFF" stroke-width="1.92" stroke-linecap="round"/>
  </g>
  
  <g filter="url(#coinShadow)" clip-path="url(#clipTopFlushR)">
    <circle cx="311" cy="150" r="16" fill="url(#goldGrad)" stroke="#FEF08A" stroke-width="1.3"/>
    <circle cx="311" cy="150" r="13" fill="none" stroke="#78350F" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.35"/>
    <path d="M304 147 H318 M311 140 V151" stroke="#78350F" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M304 147 H318 M311 140 V151" stroke="#FFFFFF" stroke-width="1.92" stroke-linecap="round"/>
  </g>

  <!-- 2 Monedas en el valle -->
  
  <g filter="url(#upperCoinShadow)">
    <circle cx="186" cy="116" r="19" fill="url(#goldGrad)" stroke="#FEF08A" stroke-width="1.52"/>
    <circle cx="186" cy="116" r="15" fill="none" stroke="#78350F" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.35"/>
    <path d="M177 116 H195 M186 107 V125" stroke="#78350F" stroke-width="3.8000000000000003" stroke-linecap="round"/>
    <path d="M177 116 H195 M186 107 V125" stroke="#FFFFFF" stroke-width="2.28" stroke-linecap="round"/>
  </g>
  
  <g filter="url(#upperCoinShadow)">
    <circle cx="326" cy="116" r="19" fill="url(#goldGrad)" stroke="#FEF08A" stroke-width="1.52"/>
    <circle cx="326" cy="116" r="15" fill="none" stroke="#78350F" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.35"/>
    <path d="M317 116 H335 M326 107 V125" stroke="#78350F" stroke-width="3.8000000000000003" stroke-linecap="round"/>
    <path d="M317 116 H335 M326 107 V125" stroke="#FFFFFF" stroke-width="2.28" stroke-linecap="round"/>
  </g>

  <!-- Monedas Laterales -->
  
  <g filter="url(#coinShadow)">
    <circle cx="148" cy="146" r="27" fill="url(#goldGrad)" stroke="#FEF08A" stroke-width="2.16"/>
    <circle cx="148" cy="146" r="22" fill="none" stroke="#78350F" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.35"/>
    <path d="M136 146 H160 M148 134 V158" stroke="#78350F" stroke-width="5.4" stroke-linecap="round"/>
    <path d="M136 146 H160 M148 134 V158" stroke="#FFFFFF" stroke-width="3.2399999999999998" stroke-linecap="round"/>
  </g>
  
  <g filter="url(#coinShadow)">
    <circle cx="364" cy="146" r="27" fill="url(#goldGrad)" stroke="#FEF08A" stroke-width="2.16"/>
    <circle cx="364" cy="146" r="22" fill="none" stroke="#78350F" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.35"/>
    <path d="M352 146 H376 M364 134 V158" stroke="#78350F" stroke-width="5.4" stroke-linecap="round"/>
    <path d="M352 146 H376 M364 134 V158" stroke="#FFFFFF" stroke-width="3.2399999999999998" stroke-linecap="round"/>
  </g>

  <!-- Gran Moneda Central Intacta -->
  
  <g filter="url(#bigCoinShadow)">
    <circle cx="256" cy="115" r="44" fill="url(#goldGrad)" stroke="#FEF08A" stroke-width="3.52"/>
    <circle cx="256" cy="115" r="35" fill="none" stroke="#78350F" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.35"/>
    <path d="M236 115 H276 M256 95 V135" stroke="#78350F" stroke-width="8.8" stroke-linecap="round"/>
    <path d="M236 115 H276 M256 95 V135" stroke="#FFFFFF" stroke-width="5.279999999999999" stroke-linecap="round"/>
  </g>
</svg>