<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradiente Oficial Solana Neón Vibrante para fondo blanco -->
    <linearGradient id="solGradWhite" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="35%" stop-color="#9945FF"/>
      <stop offset="75%" stop-color="#00C48C"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>

    <!-- Gradiente Monedas Oro y Abundancia de Alto Contraste -->
    <linearGradient id="goldGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Sombra suave para fondo blanco -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>

    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#78350F" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- FONDO BLANCO PURO (Como solicitado para integrar perfecto con la app) -->
  <rect width="512" height="512" rx="128" fill="#FFFFFF"/>
  <rect width="508" height="508" x="2" y="2" rx="126" stroke="#E2E8F0" stroke-width="2"/>

  <!-- LA 'T' ESTILO SOLANA (Cortes angulares y dinámicos) -->
  <g filter="url(#softShadow)">
    <!-- Barra Superior de la T: Paralelepípedo Dinámico Solana -->
    <path d="M125 158 L365 158 C378 158 387 149 391 136 L401 106 C405 93 395 81 381 81 L141 81 C128 81 119 90 115 103 L105 133 C101 146 111 158 125 158 Z" fill="url(#solGradWhite)"/>

    <!-- Tronco Vertical de la T: Corte Inclinado Solana descendiendo hacia la base -->
    <path d="M232 174 H280 C287 174 293 179 291 186 L272 295 C271 301 265 306 259 306 H245 C239 306 234 301 235 295 L247 186 C248 179 253 174 232 174 Z" fill="url(#solGradWhite)"/>
  </g>

  <!-- BASE DE LA ABUNDANCIA: CASCADA DE MONEDAS CON TILDE CHECK CADA UNA -->
  
  <!-- Moneda Izquierda con Tilde -->
  <g filter="url(#coinShadow)">
    <circle cx="160" cy="385" r="44" fill="url(#goldGradWhite)" stroke="#FEF08A" stroke-width="3"/>
    <circle cx="160" cy="385" r="36" fill="none" stroke="#78350F" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.35"/>
    <!-- Tilde blanca nítida -->
    <path d="M144 385 L155 396 L176 374" stroke="#78350F" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M144 385 L155 396 L176 374" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Moneda Derecha con Tilde -->
  <g filter="url(#coinShadow)">
    <circle cx="352" cy="385" r="44" fill="url(#goldGradWhite)" stroke="#FEF08A" stroke-width="3"/>
    <circle cx="352" cy="385" r="36" fill="none" stroke="#78350F" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.35"/>
    <!-- Tilde blanca nítida -->
    <path d="M336 385 L347 396 L368 374" stroke="#78350F" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M336 385 L347 396 L368 374" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Moneda Central Principal al Frente (Más grande, con Tilde de Confirmación) -->
  <g filter="url(#coinShadow)">
    <circle cx="256" cy="365" r="54" fill="url(#goldGradWhite)" stroke="#FEF08A" stroke-width="4"/>
    <circle cx="256" cy="365" r="44" fill="none" stroke="#78350F" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>
    <!-- Tilde blanca nítida -->
    <path d="M236 365 L250 379 L277 350" stroke="#78350F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M236 365 L250 379 L277 350" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Pequeño destello cian de Solana en la esquina superior derecha -->
  <circle cx="388" cy="92" r="6" fill="#14F195"/>
</svg>
